name: Create version release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/outback_mate3s/manifest.json"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("custom_components/outback_mate3s/manifest.json")
          print(json.loads(manifest.read_text(encoding="utf-8"))["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "OutBack MATE3s $VERSION" \
              --generate-notes
          fi
